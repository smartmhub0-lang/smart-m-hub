services:
  - type: web
    name: smart-m-hub
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT --proxy-headers --timeout-keep-alive 10 --backlog 2048
    healthCheckPath: /api/ready
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: MONGO_URL
        # Set the full Atlas URI in Render. Credentials must be URI-encoded and
        # Atlas database users normally require authSource=admin.
        sync: false
      - key: DB_NAME
        # The application database is selected separately from the Atlas URI.
        value: smart_m_hub_beta
      - key: SECRET_KEY
        sync: false
      - key: SUPER_ADMIN_EMAIL
        value: chrisadundi1@gmail.com
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      # Upload durability requires the existing S3-compatible storage support.
      # Set STORAGE_BACKEND=s3 and the S3 variables in the Render Dashboard.
      - key: STORAGE_BACKEND
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false
      - key: EMAIL_PROVIDER
        # Supported values include smtp, sendgrid, and resend.
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SUPER_ADMIN_WELCOME_EMAIL_ENABLED
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_USE_TLS
        sync: false
      - key: SMTP_USE_SSL
        sync: false
      - key: EMAIL_API_KEY
        sync: false
      - key: EMAIL_API_URL
        sync: false

  - type: web
    name: smart-m-hub-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: build
    autoDeployTrigger: commit
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_BACKEND_URL
        value: https://smart-m-hub.onrender.com

  - type: web
    name: smart-m-hub-super-admin
    runtime: static
    rootDir: super-admin-dashboard
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://smart-m-hub.onrender.com/api/platform
